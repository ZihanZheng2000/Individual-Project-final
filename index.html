<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MailFlow — Email Safety Prototype</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#26364c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,select:focus-visible{outline:3px solid #90b8ff;outline-offset:2px}.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}.sidebar{background:#eaf0f8;border-right:1px solid #dce5ef;padding:24px 16px}.logo{font-size:24px;font-weight:800;color:#1764c5;letter-spacing:-.7px;margin:0 10px 30px}.logo span{font-size:14px;color:#75869b;font-weight:500;display:block;letter-spacing:0;margin-top:6px}.new{background:#1668d5;color:#fff;border-radius:9px;padding:13px 18px;font-weight:700;width:100%;text-align:left;margin-bottom:24px}.nav{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:transparent;border-radius:9px;text-align:left;color:#394c66;margin:5px 0}.nav.active{background:#d8e8ff;color:#135bb5;font-weight:700}.count{background:#fff;border-radius:20px;font-size:12px;padding:3px 9px}.sidefoot{font-size:12px;color:#728198;margin:32px 12px;line-height:1.6}.main{padding:25px 34px 70px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:26px}.search{border:1px solid #dce4ee;border-radius:10px;background:white;padding:12px 16px;max-width:440px;width:100%;color:#51647d;font-size:14px}.pill{font-size:12px;background:#e8f1ff;color:#175bb2;padding:9px 13px;border-radius:30px;font-weight:650;white-space:nowrap}.surface{background:#fff;border:1px solid #e4e9f0;border-radius:16px;box-shadow:0 5px 20px #21334a08;padding:30px;min-height:670px}h1{font-size:29px;letter-spacing:-.8px;margin:0 0 6px}h2{font-size:22px;margin:0 0 12px}.subtitle{color:#697c93;font-size:14px;margin:0 0 25px}.message{width:100%;display:block;text-align:left;border:1px solid #e6ecf4;background:#f8fafd;border-radius:11px;margin:12px 0;padding:19px 21px;color:inherit;transition:.15s}.message:hover{border-color:#9fc5fa;background:#eff6ff}.messagehead{display:flex;align-items:center;justify-content:space-between;gap:10px}.subject{font-size:18px;font-weight:750}.meta{color:#6b7d93;font-size:13px;margin:9px 0}.preview{font-size:14px;color:#43556c;margin:0}.tag{font-size:11px;font-weight:750;border-radius:20px;padding:7px 11px;white-space:nowrap;background:#fce8eb;color:#b62e42}.tag.good{background:#e6f6ed;color:#14754e}.tag.blue{background:#e8f0ff;color:#185bb1}.empty{padding:65px 15px;text-align:center;color:#708096}.empty .symbol{font-size:46px;display:block;margin-bottom:10px}.back{background:none;color:#1667cf;font-weight:700;padding:0;margin-bottom:24px}.detail{max-width:850px}.field{padding:13px 0;border-bottom:1px solid #e6eaf0;font-size:14px;color:#6a7b90}.field strong{color:#293b54;margin-left:10px;font-weight:600}.body{padding:27px 0 24px;line-height:2.1;font-size:16px;white-space:pre-line}.mark{color:#a82033;text-decoration-line:underline;text-decoration-color:#e0394d;text-decoration-thickness:3px;text-underline-offset:5px;font-weight:650}.warning{border-left:4px solid #d53d4e;background:#fff0f2;border-radius:8px;padding:17px 19px;margin:12px 0 18px}.warning strong{color:#a72537}.warning p{font-size:14px;color:#83535b;line-height:1.6;margin:7px 0 0}.safe{background:#e9f7ee;border-left:4px solid #23a36b;padding:15px 18px;border-radius:8px;color:#176b4b;font-weight:650;margin:16px 0}.attachment{border:1px dashed #b7c8dc;border-radius:10px;padding:16px;margin:20px 0;background:#f8fafd}.attachment strong{display:block;margin-bottom:7px}.attachment .file{display:inline-block;background:#e7f0ff;border-radius:8px;padding:10px 15px;color:#185db6;font-size:14px}.attachment .none{color:#ac4454;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.primary,.secondary,.danger,.ghost{padding:11px 17px;border-radius:9px;font-weight:700;font-size:14px}.primary{background:#1668d5;color:white}.secondary{background:#e8eff8;color:#2f4a6b}.danger{background:#c83446;color:white}.ghost{background:white;border:1px solid #cfd9e6;color:#37516e}.primary:disabled{opacity:.45;cursor:not-allowed}.settingsRow{display:flex;align-items:center;justify-content:space-between;border:1px solid #e4eaf2;border-radius:12px;padding:18px;margin:12px 0;max-width:650px}.settingsRow.selected{border-color:#5b9cf4;background:#edf5ff}.settingsRow label{cursor:pointer;display:flex;gap:14px;align-items:center;font-weight:650}.settingsRow input{accent-color:#176bd8;width:18px;height:18px}.toast{position:fixed;bottom:26px;right:30px;z-index:20;width:min(460px,calc(100vw - 30px));padding:19px 21px;background:#1e334d;color:white;border-radius:13px;box-shadow:0 12px 38px #10223c40}.toast h3{margin:0 0 7px;font-size:17px}.toast p{margin:0 0 14px;color:#d5e3f4;font-size:13px;line-height:1.5}.progress{height:5px;background:#59718e;border-radius:10px;margin:12px 0 17px;overflow:hidden}.progress>div{height:100%;background:#7fb5ff;transition:width .25s}.toast button{background:#fff;color:#174f9c;border-radius:7px;padding:9px 15px;font-weight:800}.modalshade{position:fixed;inset:0;background:#14243b75;display:flex;align-items:center;justify-content:center;z-index:30;padding:15px}.modal{background:white;border-radius:16px;padding:30px;width:min(530px,100%);box-shadow:0 20px 70px #0d1d3345}.modal h2{margin:0 0 12px}.modal p{color:#5d6e83;line-height:1.7}.modal .actions{margin-top:22px}.notice{padding:14px 17px;border-radius:9px;background:#f1f6fd;color:#345474;font-size:14px;margin:15px 0}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.mini{font-size:12px;color:#76889d}.banner{background:#edf7f1;color:#176747;border-radius:8px;padding:12px 16px;margin:0 0 20px;font-size:14px}.sentmeta{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.smallbadge{padding:7px 10px;background:#f0f4f9;border-radius:7px;font-size:13px;color:#486079}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{padding:12px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}.logo{margin:0 8px 0 0;font-size:19px}.logo span,.sidefoot{display:none}.new{width:auto;margin:0;padding:10px}.nav{width:auto;padding:9px 11px;margin:0;font-size:12px}.count{display:none}.main{padding:18px 12px}.surface{padding:20px;min-height:550px}.top{margin-bottom:15px}.pill{display:none}.messagehead{align-items:flex-start;flex-direction:column}.tag{font-size:10px}}
.pending-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pending-actions button{min-width:126px}.pending-actions .send-now{background:#1769d6;color:#fff;font-weight:700;border-radius:8px;padding:11px 16px}.pending-actions .send-now:hover{background:#1054af}</style></head><body><div id="app"></div><script>
const KEY='mailflow-state-v4';const templates=[{id:'report',subject:'Project Report',to:'alex.morgan@example.com',body:'Hi Alex,\n\nPlease see the attached report for this quarter.\n\nBest,\nJordan',issue:'attachment',label:'Missing attachment'},{id:'budget',subject:'Conference Travel',to:'travel.team@example.com',body:'Hi Travel Team,\n\nHere are the details for next week’s conference trip. Please confirm the meeting time.\n\nBest,\nJordan',issue:'sensitive',label:'Sensitive information'},{id:'recipient',subject:'Project Meeting Notes',to:'external.partner@example.com',body:'Hi team,\n\nHere are the notes from our internal project meeting.\n\nBest,\nJordan',issue:'recipient',label:'Wrong recipient'},{id:'meeting',subject:'Meeting Update',to:'sam.rivera@example.com',body:'Hi Sam,\n\nOur meeting is scheduled for Thursday at 2 PM.\n\nSee you then,\nJordan',issue:null,label:'No issue'}];
const defaults=()=>({messages:templates.map(m=>({...m,folder:'drafts',fixed:false,attached:m.issue==='sensitive',read:false,sentAt:null,approval:false})),delay:30});let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults();if(!Array.isArray(data.messages)||!data.messages.some(m=>m.id==='report'))data=defaults()}catch{data=defaults()}let view='drafts',selected=null,modal=null,pending=null,notice='',search='',timer=null;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const count=f=>data.messages.filter(m=>m.folder===f).length;const get=id=>data.messages.find(m=>m.id===id);const isIssue=m=>!!m.issue&&!m.fixed;const issueText=m=>m.issue==='attachment'?'Missing attachment':m.issue==='sensitive'?'Sensitive information':m.issue==='recipient'?'Possible wrong recipient':'No issues';function nav(v){view=v;selected=null;modal=null;notice='';render()}function openMail(id){selected=id;view='detail';notice='';render()}function reset(){if(!confirm('Reset all four prepared emails and settings?'))return;clearInterval(timer);pending=null;data=defaults();save();nav('drafts')}function repair(){const m=get(selected);if(!m)return;m.fixed=true;if(m.issue==='attachment')m.attached=true;if(m.issue==='recipient')m.to='project.team@example.com';if(m.issue==='sensitive')m.attached=false;save();notice='The issue has been corrected in this prepared email.';render()}function undoRepair(){const m=get(selected),base=templates.find(t=>t.id===selected);Object.assign(m,{fixed:false,attached:base.issue==='sensitive',to:base.to,body:base.body});save();render()}function startSend(){const m=get(selected);if(!m||m.folder!=='drafts')return;if(isIssue(m)){modal={type:'warning',id:m.id};render();return}beginPending(m.id)}function ignoreAndSend(){const id=modal.id;modal=null;beginPending(id)}function beginPending(id){clearInterval(timer);pending={id,end:Date.now()+data.delay*1000,total:data.delay};selected=null;view='drafts';notice='';render();timer=setInterval(tick,250)}function tick(){if(!pending)return;const remain=Math.max(0,Math.ceil((pending.end-Date.now())/1000));if(remain===0){completeSend();return}const t=$('countdown'),bar=$('bar');if(t)t.textContent=remain;if(bar)bar.style.width=(remain/pending.total*100)+'%'}function undo(){if(!pending)return;clearInterval(timer);const id=pending.id;pending=null;notice=get(id).subject+' — sending canceled. The email remains in Drafts.';view='drafts';render()}function completeSend(){if(!pending)return;clearInterval(timer);const m=get(pending.id);m.folder='sent';m.sentAt=Date.now();m.read=false;m.approval=false;pending=null;save();view='sent';selected=null;notice=m.subject+' was delivered. It has moved from Drafts to Sent Items.';render()}function recall(id){const m=get(id);if(!m||m.folder!=='sent')return;const eligible=!m.read;modal={type:eligible?'recall':'consent',id};render()}function confirmRecall(){const m=get(modal.id);if(!m)return;m.folder='drafts';m.sentAt=null;m.read=false;m.approval=false;modal=null;selected=null;view='drafts';save();notice=m.subject+' was successfully recalled and restored to Drafts.';render()}function requestApproval(){const m=get(modal.id);m.approval=true;modal=null;save();notice='Recall approval requested. The email remains in Sent Items until approved.';render()}function approveRecall(id){modal={type:'approved',id};render()}function confirmApproval(){confirmRecall()}function setDelay(n){data.delay=n;save();render()}function setRead(id,v){get(id).read=v;save();render()}function del(id){get(id).folder='deleted';selected=null;view='deleted';save();notice='Message moved to Deleted Items.';render()}function restore(id){get(id).folder='drafts';selected=null;view='drafts';save();notice='Message restored to Drafts.';render()}
function messageCard(m){const sent=m.folder==='sent';const status=sent?(m.approval?'AWAITING APPROVAL':m.read?'OPENED':'SENT · UNOPENED'):m.folder==='deleted'?'DELETED':isIssue(m)?m.label.toUpperCase():'NO ISSUE';return `<button class="message" onclick="openMail('${m.id}')"><div class="messagehead"><span class="subject">${esc(m.subject)}</span><span class="tag ${sent?'blue':isIssue(m)?'':'good'}">${esc(status)}</span></div><div class="meta">To: ${esc(m.to)}</div><p class="preview">${esc(m.body.split('\n').filter(Boolean).find(x=>!x.startsWith('Hi ')&&!x.startsWith('Best')&&!x.startsWith('Jordan'))||m.body.slice(0,90))}</p></button>`}
function listView(){const f=view==='sent'?'sent':view==='deleted'?'deleted':view==='inbox'?'inbox':'drafts';const items=f==='inbox'?[]:data.messages.filter(m=>m.folder===f).filter(m=>!search||[m.subject,m.to,m.body].join(' ').toLowerCase().includes(search.toLowerCase()));const titles={drafts:'Drafts',sent:'Sent Items',deleted:'Deleted Items',inbox:'Inbox'};const sub={drafts:'Four prepared scenarios. Each email has at most one issue.',sent:'Only messages you actually send appear here. Select one to try Recall.',deleted:'Deleted emails can be restored to Drafts.',inbox:'The focus of this prototype is composing, sending and recovering email.'};return `<h1>${titles[f]}</h1><p class="subtitle">${sub[f]}</p>${items.length?items.map(messageCard).join(''):`<div class="empty"><span class="symbol">${f==='sent'?'✉':'▤'}</span><strong>${f==='sent'?'No sent messages yet':f==='drafts'?'No drafts remaining':f==='inbox'?'No incoming messages in this study':'No deleted messages'}</strong><p>${f==='sent'?'Send a prepared draft to see it here.':f==='inbox'?'Open Drafts to start the evaluation.':'Use the sidebar to continue.'}</p></div>`}`}
function highlightedBody(m){let b=esc(m.body);if(!isIssue(m))return b;if(m.issue==='attachment')return b.replace('attached report','<span class="mark">attached report</span>');if(m.issue==='recipient')return b;return b}function detailView(){const m=get(selected);if(!m){view='drafts';return listView()}const sent=m.folder==='sent',deleted=m.folder==='deleted';const warning=m.issue==='attachment'?['Possible missing attachment','You mentioned an attached report, but no file is attached.']:m.issue==='sensitive'?['Sensitive attachment detected','This email includes Visa_Scan.pdf, which may contain highly personal identity information. The message does not mention this file. Review the attachment before sending.']:['Possible wrong recipient','This internal project message is addressed to an external recipient. Review the address before sending.'];return `<button class="back" onclick="nav('${m.folder==='sent'?'sent':deleted?'deleted':'drafts'}')">← Back to ${sent?'Sent Items':deleted?'Deleted Items':'Drafts'}</button><div class="detail"><h1>${esc(m.subject)}</h1><div class="field">To: <strong class="${m.issue==='recipient'&&isIssue(m)?'mark':''}">${esc(m.to)}</strong></div><div class="field">Subject: <strong>${esc(m.subject)}</strong></div><div class="body">${highlightedBody(m)}</div>${!sent&&!deleted?`<div class="attachment"><strong>Attachments (${m.attached?1:0})</strong>${m.attached?m.issue==='sensitive'?'<span class="file mark">📎 Visa_Scan.pdf · 1.8 MB · Personal document</span>':'<span class="file">📎 Quarterly_Report.pdf · 2.4 MB</span>':'<span class="none">No attachments</span>'}</div>${isIssue(m)?`<div class="warning"><strong>⚠ ${warning[0]}</strong><p>${warning[1]}</p></div>`:m.issue?'<div class="safe">✓ Issue resolved. Ready to send.</div>':'<div class="safe">✓ No potential issues detected. Ready to send.</div>'}<div class="actions">${isIssue(m)?`<button class="primary" onclick="repair()">${m.issue==='attachment'?'Attach report':m.issue==='sensitive'?'Remove attachment':'Correct recipient'}</button>`:m.fixed?'<button class="secondary" onclick="undoRepair()">Undo correction</button>':''}<button class="primary" onclick="startSend()">Send email</button><button class="secondary" onclick="nav('drafts')">Back to Drafts</button></div>`:sent?`<div class="sentmeta"><span class="smallbadge">${m.read?'Opened by recipient':'Unopened by recipient'}</span><span class="smallbadge">${m.read?'Recipient approval required':'Direct recall available'}</span></div>${m.approval?'<div class="warning"><strong>Recall approval pending</strong><p>The message remains in Sent Items until the recipient approves the request.</p></div>':''}<div class="actions"><button class="primary" onclick="recall('${m.id}')">Recall message</button>${m.approval?`<button class="secondary" onclick="approveRecall('${m.id}')">Simulate recipient approval</button>`:''}<button class="secondary" onclick="setRead('${m.id}',${!m.read})">Simulate ${m.read?'unread':'opened'}</button><button class="ghost" onclick="del('${m.id}')">Delete</button></div><p class="mini">Study controls simulate recipient behavior and elapsed time; no real email is delivered.</p>`:`<div class="actions"><button class="primary" onclick="restore('${m.id}')">Restore to Drafts</button></div>`}</div>`}
function settingsView(){return `<h1>Settings</h1><p class="subtitle">Configure the Undo Send delay. Your selection controls the actual countdown when sending any prepared draft.</p><h2>Undo Send delay</h2>${[10,30,60].map(n=>`<div class="settingsRow ${data.delay===n?'selected':''}"><label><input type="radio" name="delay" ${data.delay===n?'checked':''} onchange="setDelay(${n})">${n} seconds</label><span class="mini">${data.delay===n?'Selected':''}</span></div>`).join('')}<div class="notice">Current delay: <strong>${data.delay} seconds</strong>. Return to Drafts and send an email to see this setting applied.</div><div class="actions"><button class="secondary" onclick="nav('drafts')">Back to Drafts</button><button class="ghost" onclick="reset()">Reset prototype</button></div>`}
function modalView(){if(!modal)return '';const m=get(modal.id);let title='',desc='',buttons='';if(modal.type==='warning'){title='Review before sending';desc=`${issueText(m)}: This prepared email still has an unresolved warning. You can go back to fix it or send anyway.`;buttons=`<button class="primary" onclick="modal=null;render()">Review draft</button><button class="secondary" onclick="ignoreAndSend()">Ignore and send</button>`}else if(modal.type==='recall'){title='Direct recall available';desc='This message has not been opened by the recipient. You can recall it directly, regardless of when it was sent. On success, it will return to Drafts.';buttons=`<button class="primary" onclick="confirmRecall()">Recall now</button><button class="secondary" onclick="modal=null;render()">Cancel</button>`}else if(modal.type==='consent'){title='Recipient approval required';desc='This message has already been opened by the recipient. Direct recall is unavailable. Requesting approval will keep the message in Sent Items until approved.';buttons=`<button class="primary" onclick="requestApproval()">Request approval</button><button class="secondary" onclick="modal=null;render()">Cancel</button>`}else{title='Simulate recipient approval';desc='In this test scenario, the recipient approves the recall request. The message will be restored to Drafts.';buttons=`<button class="primary" onclick="confirmApproval()">Approve recall</button><button class="secondary" onclick="modal=null;render()">Cancel</button>`}return `<div class="modalshade"><div class="modal"><h2>${title}</h2><p>${desc}</p><div class="actions">${buttons}</div></div></div>`}
function render(){const folders=[['inbox','Inbox'],['drafts','Drafts'],['sent','Sent Items'],['deleted','Deleted Items'],['settings','Settings']];const active=view==='detail'?get(selected)?.folder||'drafts':view;const content=view==='detail'?detailView():view==='settings'?settingsView():listView();$('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo">✉ MailFlow<span>Email Safety Prototype</span></div><button class="new" onclick="nav('drafts')">+ Prepared drafts</button>${folders.map(([v,label])=>`<button class="nav ${active===v?'active':''}" onclick="nav('${v}')"><span>${label}</span>${['drafts','sent','deleted'].includes(v)?`<span class="count">${count(v)}</span>`:''}</button>`).join('')}<div class="sidefoot">HCI research prototype<br>Simulated email only · No real delivery<br><a href="#" onclick="event.preventDefault();reset()">Reset all scenarios</a></div></aside><main class="main"><div class="top"><input class="search" aria-label="Search emails" placeholder="Search prepared messages..." value="${esc(search)}" oninput="search=this.value;renderSearch()"><span class="pill">Undo Send: ${data.delay}s</span></div><section class="surface">${notice?`<div class="banner">${esc(notice)}</div>`:''}${content}</section></main></div>${pending?`<div class="toast"><h3>Message pending — not delivered</h3><p>${esc(get(pending.id).subject)} · Undo Send delay: ${pending.total} seconds</p><div class="progress"><div id="bar" style="width:100%"></div></div><p>Sending in <strong id="countdown">${Math.max(0,Math.ceil((pending.end-Date.now())/1000))}</strong> seconds</p><div class="pending-actions"><button onclick="undo()">Undo Send</button><button class="send-now" onclick="completeSend()">Send Now →</button></div></div>`:''}${modalView()}`;if(pending)tickDisplay()}function tickDisplay(){if(!pending)return;const t=$('countdown'),bar=$('bar');if(t)t.textContent=Math.max(0,Math.ceil((pending.end-Date.now())/1000));if(bar)bar.style.width=Math.max(0,(pending.end-Date.now())/(pending.total*1000)*100)+'%'}function renderSearch(){const el=document.querySelector('.search');const pos=el.selectionStart;const value=el.value;search=value;if(view==='detail'||view==='settings')return;render();const e=document.querySelector('.search');e.focus();e.setSelectionRange(pos,pos)}render();
</script></body></html>
